# Moonlight — 50 Test Sites Suite
# Defined in docs/06-engineering-handbook.md (Composition of the 50 test sites)
# Used for Phase F0 baseline, smoke tests, and compatibility tracking.

[[sites]]
id = "github"
name = "GitHub"
category = "Documentation & developer"
url = "https://github.com"
smoke_test = "Verify header navigation, search bar, repository feed load, and no fatal script errors"
priority = "Alpha"

